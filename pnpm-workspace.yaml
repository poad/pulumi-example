packages:
  - pulumi-start-aws
  - s3-bucket

allowBuilds:
  '@pulumi/docker': false
  '@pulumi/docker-build': false
  esbuild: false
  protobufjs: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.3.4

overrides:
  '@types/react': '>=19.2.2'
  '@types/react-dom': '>=19.2.2'
  axios@=1.10.0: '>=1.11.0'
  glob@>=10.3.7 <=11.0.3: '>=11.1.0'
  jsondiffpatch@<0.7.2: '>=0.7.2'
