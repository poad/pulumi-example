packages:
  - pulumi-start-aws
  - s3-bucket

allowBuilds:
  '@pulumi/docker': false
  '@pulumi/docker-build': false
  esbuild: false
  protobufjs: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.20.0

overrides:
  minimatch@<11.0.1: ^11.0.1
